server {
    listen 80 default_server;
    # El proxy de entrada (172.16.99.101) reenvía fix.felixpa.com a este puerto.
    listen 3002;
    server_name fix.felixpa.com 172.16.98.151 _;

    # Con el login activo, Keycloak solo acepta volver a https://fix.felixpa.com:
    # quien entre por la IP se manda allá (si no, el inicio de sesión falla).
    if ($host = 172.16.98.151) {
        return 301 https://fix.felixpa.com$request_uri;
    }

    root /opt/Belleza/portal/dist;
    index index.html;

    # Las fotos de evidencia pueden pesar hasta EVIDENCE_MAX_SIZE_MB (5MB por
    # defecto). El límite por defecto de Nginx es 1MB: sin esto, la subida
    # se corta con 413 antes de llegar a Express.
    client_max_body_size 8m;

    # No anunciar la versión de Nginx en errores ni cabeceras.
    server_tokens off;

    # Compresión: el JS del portal baja de ~200 KB a ~65 KB, y el catálogo
    # de proveedores/marcas (JSON de la API) de ~30 KB a ~6 KB.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Reclamos: el alta sube el Excel (hasta RECLAMOS_MAX_SIZE_MB, 15 MB) y los
    # PDF de sus documentos SAP en la misma petición; con 8m se cortaba con 413.
    # Sin la barra final: el listado (GET /api/reclamos?…) y el alta
    # (POST /api/reclamos) no llevan barra. Con «location /api/reclamos/» Nginx
    # les respondía 301 hacia http://…:3002 y se rompían.
    location /api/reclamos {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Vite pone un hash en el nombre de cada archivo de /assets: si cambia el
    # contenido cambia el nombre, así que el navegador los puede guardar un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Cabeceras de seguridad del portal (las de /api las pone helmet en src/app.js).
        # add_header dentro de un location reemplaza los del server: por eso van aquí.
        # La CSP va en modo «solo informe» para no romper nada: es la misma de app.js.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # index.html siempre se revalida, para que tras cada build se vea la versión nueva.
    location / {
        add_header Cache-Control "no-cache";
        # Cabeceras de seguridad del portal (las de /api las pone helmet en src/app.js).
        # add_header dentro de un location reemplaza los del server: por eso van aquí.
        # La CSP va en modo «solo informe» para no romper nada: es la misma de app.js.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri /index.html;
    }
}
